<!DOCTYPE html>

<head>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #202938;
      background: #f3f5f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #f3f5f8;
    }
    .panel {
      width: 100%;
      max-width: 520px;
      margin: 24px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #e4e8ee;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(25, 40, 60, 0.06);
    }
    h1 { margin: 0 0 6px; font-size: 25px; }
    h2 { margin: 0 0 20px; font-size: 17px; font-weight: 500; color: #667085; }
    .status {
      margin: 10px 0;
      padding: 13px 14px;
      border-radius: 9px;
      background: #f0f3f7;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .status.ok { background: #eaf7ef; color: #176b38; }
    .status.warn { background: #fff6e5; color: #865b00; }
    .status.error { background: #fdeeee; color: #9b2525; }
    .section-title {
      margin: 24px 0 8px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      margin: 10px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      font-size: 14px;
      color: #202938;
      background: #fff;
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 14px;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .note {
      margin: 10px 0 0;
      color: #667085;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Asmia</h1>
    <h2>Тест авторизации MAX</h2>

    <div class="status" id="bridge">Проверка MAX Bridge...</div>
    <div class="status" id="data">Проверка initData...</div>
    <div class="status" id="user">Проверка пользователя...</div>
    <div class="status" id="platform">Проверка платформы...</div>

    <div class="section-title">Проверка серверной авторизации</div>
    <label for="apiUrl">HTTPS-адрес сервера, заканчивающийся на /auth/max</label>
    <input
      id="apiUrl"
      type="url"
      inputmode="url"
      autocomplete="url"
      placeholder="https://ваш-защищённый-адрес/auth/max"
      aria-describedby="apiHelp"
    >
    <p class="note" id="apiHelp">
      Адрес появится после настройки защищённого HTTPS-доступа к тестовому серверу.
      Не указывайте здесь токен MAX или строку initData.
    </p>

    <button id="checkServer" type="button">Проверить авторизацию на сервере</button>
    <div class="status" id="serverResult" aria-live="polite">Ожидает проверки.</div>
  </main>

  <script>
    (() => {
      const bridge = window.WebApp;
      const bridgeElement = document.getElementById("bridge");
      const dataElement = document.getElementById("data");
      const userElement = document.getElementById("user");
      const platformElement = document.getElementById("platform");
      const button = document.getElementById("checkServer");
      const serverResult = document.getElementById("serverResult");
      const apiUrlInput = document.getElementById("apiUrl");

      function setStatus(element, message, type) {
        element.textContent = message;
        element.className = "status" + (type ? " " + type : "");
      }

      if (!bridge) {
        setStatus(bridgeElement, "MAX Bridge не обнаружен", "error");
        setStatus(dataElement, "Нет данных запуска MAX", "error");
        setStatus(userElement, "Пользователь не определён", "warn");
        setStatus(platformElement, "Платформа не определена", "warn");
      } else {
        setStatus(bridgeElement, "MAX Bridge подключён", "ok");

        const initData = typeof bridge.initData === "string" ? bridge.initData : "";
        setStatus(
          dataElement,
          initData.length > 0
            ? "initData получен. Длина: " + initData.length
            : "initData отсутствует",
          initData.length > 0 ? "ok" : "error"
        );

        // initDataUnsafe используется только для диагностического признака наличия user.
        // Подлинность пользователя подтверждается исключительно серверной проверкой initData.
        const user = bridge.initDataUnsafe && bridge.initDataUnsafe.user;
        setStatus(
          user && user.id
            ? userElement
            : userElement,
          user && user.id
            ? "Пользователь обнаружен. ID получен."
            : "Данные пользователя отсутствуют",
          user && user.id ? "ok" : "warn"
        );

        setStatus(
          platformElement,
          "Платформа: " + (bridge.platform || "не определена"),
          "ok"
        );
      }

      button.addEventListener("click", async () => {
        if (!bridge || typeof bridge.initData !== "string" || !bridge.initData) {
          setStatus(serverResult, "Нет initData от MAX. Открой страницу через тестового бота MAX.", "error");
          return;
        }

        const apiUrl = apiUrlInput.value.trim();
        if (!apiUrl) {
          setStatus(serverResult, "Сначала нужен HTTPS-адрес тестового сервера. Его настроим следующим шагом.", "warn");
          return;
        }

        let parsedUrl;
        try {
          parsedUrl = new URL(apiUrl);
        } catch (_) {
          setStatus(serverResult, "Проверь адрес сервера: это должна быть корректная HTTPS-ссылка.", "error");
          return;
        }

        if (parsedUrl.protocol !== "https:") {
          setStatus(serverResult, "Нужен HTTPS-адрес. HTTP и 127.0.0.1 здесь использовать нельзя.", "error");
          return;
        }

        button.disabled = true;
        setStatus(serverResult, "Отправляем initData на сервер для проверки подписи...", "warn");

        try {
          const response = await fetch(parsedUrl.toString(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ webapp_data: bridge.initData })
          });

          let responseData = {};
          try {
            responseData = await response.json();
          } catch (_) {
            responseData = {};
          }

          if (response.ok && responseData.authenticated === true && responseData.user_id) {
            setStatus(
              serverResult,
              "Авторизация успешна. Сервер подтвердил пользователя. ID: " + responseData.user_id,
              "ok"
            );
          } else if (response.status === 401) {
            setStatus(serverResult, "Сервер отклонил авторизацию (401). Проверь подпись initData и серверное время.", "error");
          } else {
            setStatus(serverResult, "Сервер вернул ошибку: " + response.status + ". Ответ не содержит подтверждения авторизации.", "error");
          }
        } catch (error) {
          setStatus(
            serverResult,
            "Не удалось связаться с сервером. Проверь HTTPS-адрес, доступность сервера и настройки CORS.",
            "error"
          );
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
